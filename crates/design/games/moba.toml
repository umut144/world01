# World 01 MOBA - which authored Prop belongs to which team

# The map is the authority on what a Prop is and where it stands. This file says
# only whose it is, because a side is a game decision and no geometry carries it.
#
# An entry names a SceneMaker `instance_id`, which is the identity the runtime
# already uses for a placed Prop and is unique within a Scene. What the Prop is -
# an Ankh, a Totem, and which Totem - comes from its Asset key in the map, so
# nothing here repeats it and nothing here can contradict it.
#
# Positions are comments. They are here so the assignment can be read without
# opening the export, and they are comments precisely so a moved Prop cannot
# leave a stale coordinate behind that something later believes. If a Prop moves,
# nothing in this file needs touching unless it changed sides.
#
# Loading fails when an entry names an instance the map does not contain, and
# when the map contains a Totem or Ankh no entry names. Both directions, because
# a forgotten Totem would otherwise be a neutral objective nobody can win by and
# a typo would be an objective that silently is not there.
#
# Teams are named for their bank of the river. map01 is 135 m wide, so the
# river runs near x = 68 m.

[maps.map01]
west = [
  "ankh_0001",             # ankh          at   37.4 m,  70.8 m
  "ankh_0002",             # ankh          at   30.0 m,  27.4 m
  "totem_of_life_0002",    # totem_of_life at    7.2 m,   8.8 m
  "totem_of_mana_0002",    # totem_of_mana at    8.2 m,  83.9 m
  "totem_of_time_0002",    # totem_of_time at    8.1 m,  48.4 m
]
east = [
  "ankh_0003",             # ankh          at  105.5 m,  69.8 m
  "ankh_0004",             # ankh          at  111.2 m,  29.6 m
  "totem_of_life_0001",    # totem_of_life at  129.0 m,  83.9 m
  "totem_of_mana_0001",    # totem_of_mana at  128.3 m,  49.1 m
  "totem_of_time_0001",    # totem_of_time at  128.2 m,   8.9 m
]
