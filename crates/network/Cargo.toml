[package]
name = "world01-network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["client", "server"]
client = [
    "lightyear/client",
    "lightyear/replication",
    "lightyear/input_native",
    "lightyear/prediction",
    "lightyear/interpolation",
    "lightyear/netcode",
    "lightyear/udp",
]
server = [
    "lightyear/server",
    "lightyear/replication",
    "lightyear/input_native",
    "lightyear/prediction",
    "lightyear/interpolation",
    "lightyear/netcode",
    "lightyear/udp",
]

[dev-dependencies]
# Tests that compose the embedded world need the Placement Ranks the world is
# actually authored with. Writing them out by hand made a fixture that drifts
# every time a Terrain Asset is added.
world01-design = { path = "../design" }

[dependencies]
bevy = { workspace = true, features = ["std", "bevy_log"] }
world01-world-data = { path = "../world_data" }
serde.workspace = true
lightyear = { workspace = true, features = ["std"] }
