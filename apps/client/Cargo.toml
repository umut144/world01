[package]
name = "world01-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
dev = ["bevy/dynamic_linking"]

[dependencies]
bevy = { workspace = true, features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "2d_bevy_render",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
    "keyboard",
    "mouse",
    "x11",
    "wayland",
] }
world01-network = { path = "../../crates/network", default-features = false, features = ["client"] }
world01-configs = { path = "../../crates/configs" }
world01-content = { path = "../../crates/content" }
world01-design = { path = "../../crates/design" }
world01-simulation = { path = "../../crates/simulation" }
world01-world-data = { path = "../../crates/world_data" }
gilrs = { workspace = true }
