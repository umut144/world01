[package]
name = "world01-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
bevy = { workspace = true, features = [
    "std",
    "multi_threaded",
    "bevy_log",
    "bevy_state",
] }
world01-configs = { path = "../../crates/configs" }
world01-content = { path = "../../crates/content" }
world01-design = { path = "../../crates/design" }
world01-network = { path = "../../crates/network", default-features = false, features = ["server"] }
world01-moba = { path = "../../crates/games/moba" }
world01-simulation = { path = "../../crates/simulation" }
world01-world-data = { path = "../../crates/world_data" }
